<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">SDK Network Architecture (M1 Series)</title>
  <desc id="desc">Onboard network of the M1 series robot: the motion control host and navigation host are interconnected through a switch with two external Ethernet ports; the SDK host can connect over WiFi or wired Ethernet.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity=".09"/>
    </filter>
    <marker id="m-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="m-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .title { font-size: 32px; font-weight: 750; }
      .subtitle { font-size: 16px; fill: #475569; }
      .panel-title { font-size: 20px; font-weight: 750; }
      .box-title { font-size: 17px; font-weight: 750; text-anchor: middle; }
      .box-text { font-size: 14px; font-weight: 650; text-anchor: middle; }
      .box-sub { font-size: 13px; fill: #475569; text-anchor: middle; }
      .link-label { font-size: 13px; }
      .legend { font-size: 13px; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="780" fill="#f8fafc"/>
  <text x="40" y="56" class="title">Robot Network Architecture (M1 Series)</text>
  <text x="40" y="88" class="subtitle">The SDK host connects over WiFi or wired Ethernet; all control and status traffic goes through the motion control host</text>

  <!-- Legend -->
  <line x1="906" y1="50" x2="942" y2="50" stroke="#64748b" stroke-width="2"/>
  <text x="950" y="55" class="legend">wired link</text>
  <line x1="1036" y1="50" x2="1072" y2="50" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1080" y="55" class="legend">wireless link</text>

  <!-- Robot panel -->
  <g filter="url(#shadow)">
    <rect x="40" y="130" width="1120" height="500" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <text x="72" y="176" class="panel-title">Robot</text>

  <!-- Motion Control Host -->
  <rect x="90" y="220" width="360" height="170" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="270" y="258" class="box-title" fill="#1e40af">Motion Control Host</text>
  <text x="270" y="284" class="box-sub">Motion control · System monitoring</text>
  <text x="270" y="308" class="box-sub">WiFi-AP: 192.168.234.1</text>
  <text x="270" y="332" class="box-sub">Wired IP: 192.168.168.168</text>
  <text x="270" y="356" class="box-sub">Ports: UDP 8082 · WebSocket 8081</text>

  <!-- Switch -->
  <rect x="530" y="250" width="180" height="100" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="620" y="292" class="box-title">Switch</text>
  <text x="620" y="318" class="box-sub">Internal link</text>

  <!-- Navigation Host -->
  <rect x="790" y="220" width="340" height="170" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="960" y="260" class="box-title" fill="#15803d">Navigation Host</text>
  <text x="960" y="288" class="box-sub">Mapping · Localization &amp; Navigation</text>
  <text x="960" y="312" class="box-sub">Obstacle avoidance</text>
  <text x="960" y="336" class="box-sub">Wired IP: 192.168.168.100</text>

  <!-- Ethernet x2 -->
  <rect x="530" y="480" width="180" height="90" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="620" y="517" class="box-title" fill="#b45309">Ethernet ×2</text>
  <text x="620" y="543" class="box-sub">External wired access</text>

  <!-- Internal links -->
  <line x1="450" y1="300" x2="526" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#m-slate)"/>
  <line x1="710" y1="300" x2="786" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#m-slate)"/>
  <line x1="620" y1="350" x2="620" y2="476" stroke="#64748b" stroke-width="2" marker-end="url(#m-slate)"/>

  <!-- Wireless access -->
  <line x1="270" y1="666" x2="270" y2="394" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m-blue)"/>
  <text x="288" y="540" class="link-label" fill="#1d4ed8">Wireless (WiFi)</text>
  <rect x="90" y="670" width="360" height="80" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="270" y="702" class="box-text" fill="#1d4ed8">SDK Host (Wireless)</text>
  <text x="270" y="728" class="box-sub">Join the robot's WiFi-AP</text>

  <!-- Wired access -->
  <path d="M 970 666 V 610 H 620 V 574" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#m-orange)"/>
  <text x="795" y="602" class="link-label" fill="#b45309">Wired network</text>
  <rect x="790" y="670" width="360" height="80" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="970" y="702" class="box-text" fill="#b45309">SDK Host (Wired)</text>
  <text x="970" y="728" class="box-sub">Robot Ethernet port, or same LAN</text>
</svg>
