<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="title desc">
  <title id="title">SDK 命令下发流程：同步与异步</title>
  <desc id="desc">对比异步模式与同步模式的命令下发流程，以及返回值、WriteHandler、ACK、状态上报四层结果确认。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity=".09"/>
    </filter>
    <marker id="m-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .title { font-size: 34px; font-weight: 750; }
      .subtitle { font-size: 17px; fill: #475569; }
      .panel-title { font-size: 21px; font-weight: 750; }
      .box-text { font-size: 15px; font-weight: 650; text-anchor: middle; }
      .box-sub { font-size: 13.5px; fill: #475569; text-anchor: middle; }
      .diamond-text { font-size: 14px; font-weight: 650; text-anchor: middle; }
      .fail-text { font-size: 13px; font-weight: 650; text-anchor: middle; dominant-baseline: middle; }
      .layer-title { font-size: 15.5px; font-weight: 750; }
      .layer-body { font-size: 13.5px; fill: #475569; }
    </style>
  </defs>

  <rect width="1500" height="800" fill="#f8fafc"/>
  <text x="50" y="54" class="title">命令下发流程：同步与异步</text>
  <text x="50" y="86" class="subtitle">所有命令接口用 timeout_ms 一个参数区分两种模式；结果确认分四层，越往下越接近“真正完成”</text>

  <!-- 异步面板 -->
  <g filter="url(#shadow)">
    <rect x="40" y="115" width="720" height="485" rx="20" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
  </g>
  <text x="70" y="152" class="panel-title" fill="#1d4ed8">异步模式（timeout_ms = 0，高频命令推荐）</text>

  <rect x="180" y="172" width="400" height="48" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="380" y="193" class="box-text" fill="#1e40af">用户调用命令接口</text>
  <text x="380" y="212" class="box-sub">timeout_ms = 0</text>

  <line x1="380" y1="220" x2="380" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#m-slate)"/>
  <polygon points="380,232 565,272 380,312 195,272" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="380" y="266" class="diamond-text">SDK 前置检查</text>
  <text x="380" y="286" class="diamond-text" font-weight="400" fill="#64748b">连接状态 · 参数 · 机型能力</text>
  <line x1="565" y1="272" x2="598" y2="272" stroke="#dc2626" stroke-width="2" marker-end="url(#m-red)"/>
  <rect x="600" y="250" width="140" height="44" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="670" y="272" class="fail-text" fill="#b91c1c">立即返回 error_code</text>

  <line x1="380" y1="312" x2="380" y2="322" stroke="#64748b" stroke-width="2" marker-end="url(#m-slate)"/>
  <rect x="180" y="324" width="400" height="52" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="380" y="346" class="box-text">命令进入异步发送队列</text>
  <text x="380" y="366" class="box-sub">函数立即返回 success，不阻塞业务线程</text>

  <line x1="380" y1="376" x2="380" y2="386" stroke="#64748b" stroke-width="2" marker-end="url(#m-slate)"/>
  <rect x="180" y="388" width="400" height="52" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="380" y="410" class="box-text">发送完成</text>
  <text x="380" y="430" class="box-sub">触发 WriteHandler(error_code) 通知发送结果</text>

  <line x1="380" y1="440" x2="380" y2="450" stroke="#64748b" stroke-width="2" marker-end="url(#m-slate)"/>
  <rect x="180" y="452" width="400" height="52" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="380" y="474" class="box-text" fill="#b91c1c">机器人接收并执行</text>
  <text x="380" y="494" class="box-sub">回复 Cmd ACK</text>

  <line x1="380" y1="504" x2="380" y2="514" stroke="#64748b" stroke-width="2" marker-end="url(#m-slate)"/>
  <rect x="180" y="516" width="400" height="52" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="380" y="538" class="box-text">SDK 解码 ACK</text>
  <text x="380" y="558" class="box-sub">触发 IControlCallback 对应应答回调</text>

  <!-- 同步面板 -->
  <g filter="url(#shadow)">
    <rect x="790" y="115" width="660" height="485" rx="20" fill="#fff" stroke="#86efac" stroke-width="2"/>
  </g>
  <text x="820" y="152" class="panel-title" fill="#15803d">同步模式（timeout_ms &gt; 0，低频关键命令）</text>

  <rect x="920" y="172" width="400" height="48" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="1120" y="193" class="box-text" fill="#166534">用户调用命令接口</text>
  <text x="1120" y="212" class="box-sub">timeout_ms &gt; 0</text>

  <line x1="1120" y1="220" x2="1120" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#m-slate)"/>
  <polygon points="1120,232 1300,268 1120,304 940,268" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="1120" y="262" class="diamond-text">SDK 前置检查</text>
  <text x="1120" y="282" class="diamond-text" font-weight="400" fill="#64748b">连接状态 · 参数 · 机型能力</text>
  <line x1="1300" y1="268" x2="1328" y2="268" stroke="#dc2626" stroke-width="2" marker-end="url(#m-red)"/>
  <rect x="1330" y="246" width="105" height="44" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="1382" y="268" class="fail-text" fill="#b91c1c">返回 error_code</text>

  <line x1="1120" y1="304" x2="1120" y2="322" stroke="#64748b" stroke-width="2" marker-end="url(#m-slate)"/>
  <rect x="920" y="324" width="400" height="52" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="1120" y="346" class="box-text">发送命令并阻塞等待</text>
  <text x="1120" y="366" class="box-sub">最长等待 timeout_ms 毫秒</text>

  <line x1="1120" y1="376" x2="1120" y2="398" stroke="#64748b" stroke-width="2" marker-end="url(#m-slate)"/>
  <polygon points="1120,400 1240,440 1120,480 1000,440" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="1120" y="445" class="diamond-text">等待结果？</text>
  <line x1="1240" y1="440" x2="1310" y2="414" stroke="#dc2626" stroke-width="2" marker-end="url(#m-red)"/>
  <rect x="1312" y="392" width="123" height="40" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="1373" y="412" class="fail-text" fill="#b91c1c">返回 timed_out</text>
  <line x1="1240" y1="440" x2="1310" y2="466" stroke="#16a34a" stroke-width="2" marker-end="url(#m-green)"/>
  <rect x="1312" y="448" width="123" height="40" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="1373" y="468" class="fail-text" fill="#15803d">返回发送结果</text>

  <line x1="1120" y1="480" x2="1120" y2="514" stroke="#64748b" stroke-width="2" marker-end="url(#m-slate)"/>
  <rect x="920" y="516" width="400" height="52" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="1120" y="538" class="box-text">机器人回复 Cmd ACK</text>
  <text x="1120" y="558" class="box-sub">触发 IControlCallback 应答（与异步模式相同）</text>

  <!-- 底部四层结果确认 -->
  <g filter="url(#shadow)">
    <rect x="40" y="630" width="340" height="140" rx="16" fill="#fff" stroke="#94a3b8"/>
    <rect x="400" y="630" width="340" height="140" rx="16" fill="#fff" stroke="#60a5fa"/>
    <rect x="760" y="630" width="340" height="140" rx="16" fill="#fff" stroke="#f59e0b"/>
    <rect x="1120" y="630" width="340" height="140" rx="16" fill="#fff" stroke="#22c55e"/>
  </g>
  <circle cx="72" cy="662" r="14" fill="#64748b"/><text x="72" y="667" class="fail-text" fill="#fff">1</text>
  <text x="96" y="668" class="layer-title" fill="#334155">返回值 error_code</text>
  <text x="60" y="700" class="layer-body">命令是否通过前置检查并发出；</text>
  <text x="60" y="722" class="layer-body">同步模式下即发送结果。</text>

  <circle cx="432" cy="662" r="14" fill="#3b82f6"/><text x="432" y="667" class="fail-text" fill="#fff">2</text>
  <text x="456" y="668" class="layer-title" fill="#1d4ed8">WriteHandler 回调</text>
  <text x="420" y="700" class="layer-body">异步模式的发送结果通知；</text>
  <text x="420" y="722" class="layer-body">仅表示“发出去了”。</text>

  <circle cx="792" cy="662" r="14" fill="#f59e0b"/><text x="792" y="667" class="fail-text" fill="#fff">3</text>
  <text x="816" y="668" class="layer-title" fill="#b45309">IControlCallback 应答</text>
  <text x="780" y="700" class="layer-body">机器人“已收到命令”（ACK）；</text>
  <text x="780" y="722" class="layer-body">不代表动作已执行完成。</text>

  <circle cx="1152" cy="662" r="14" fill="#22c55e"/><text x="1152" y="667" class="fail-text" fill="#fff">4</text>
  <text x="1176" y="668" class="layer-title" fill="#15803d">RobotState / 任务回调</text>
  <text x="1140" y="700" class="layer-body">motion_status、OnTaskStateData()</text>
  <text x="1140" y="722" class="layer-body">才代表动作 / 任务真正完成。</text>
</svg>
