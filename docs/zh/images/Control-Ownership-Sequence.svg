<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" role="img" aria-labelledby="title desc">
  <title id="title">SDK and APP control ownership sequence diagram</title>
  <desc id="desc">The SDK connects first and owns control; the APP takes over and the SDK becomes an observer; after the APP disconnects, the SDK requests ownership again.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
    <marker id="m-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 32px; font-weight: 750; }
      .subtitle { font-size: 17px; fill: #475569; }
      .actor { font-size: 18px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .msg { font-size: 15px; fill: #334155; text-anchor: middle; }
      .note-title { font-size: 15px; font-weight: 700; }
      .note-body { font-size: 14px; }
      .legend { font-size: 15px; fill: #475569; }
    </style>
  </defs>

  <rect width="1240" height="900" fill="#f8fafc"/>
  <text x="70" y="56" class="title">Ownership Sequence: SDK First, APP Takes Over Later</text>
  <text x="70" y="88" class="subtitle">From the SDK owning control, to losing it to the APP, to requesting it again after the APP disconnects</text>

  <!-- Lifelines -->
  <line x1="200" y1="164" x2="200" y2="845" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="620" y1="164" x2="620" y2="845" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="1040" y1="164" x2="1040" y2="845" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Ownership segments -->
  <line x1="200" y1="252" x2="200" y2="403" stroke="#16a34a" stroke-width="6" stroke-linecap="round" opacity=".85"/>
  <line x1="200" y1="417" x2="200" y2="763" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" opacity=".85"/>
  <line x1="200" y1="777" x2="200" y2="838" stroke="#16a34a" stroke-width="6" stroke-linecap="round" opacity=".85"/>
  <line x1="1040" y1="368" x2="1040" y2="548" stroke="#2563eb" stroke-width="6" stroke-linecap="round" opacity=".85"/>

  <!-- Actors -->
  <g filter="url(#shadow)">
    <rect x="85" y="120" width="230" height="44" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/>
    <rect x="505" y="120" width="230" height="44" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="925" y="120" width="230" height="44" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  </g>
  <text x="200" y="142" class="actor">SDK Client</text>
  <text x="620" y="142" class="actor">Robot (arbiter)</text>
  <text x="1040" y="142" class="actor">APP</text>

  <!-- Messages -->
  <text x="410" y="183" class="msg">① Connect(): connect + handshake</text>
  <line x1="212" y1="195" x2="608" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#m-slate)"/>

  <text x="410" y="233" class="msg">② Handshake OK (first come, first served): SDK owns control</text>
  <line x1="608" y1="245" x2="212" y2="245" stroke="#16a34a" stroke-width="2" marker-end="url(#m-green)"/>

  <text x="410" y="288" class="msg">③ Normal commands: Move() / StandUp() / ...</text>
  <line x1="212" y1="300" x2="608" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#m-slate)"/>

  <text x="830" y="348" class="msg">④ APP connects and takes over</text>
  <line x1="1028" y1="360" x2="632" y2="360" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>

  <text x="410" y="398" class="msg">⑤ Push: ownership taken</text>
  <line x1="608" y1="410" x2="212" y2="410" stroke="#dc2626" stroke-width="2" marker-end="url(#m-red)"/>

  <rect x="230" y="440" width="360" height="76" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="250" y="466" class="note-title" fill="#b45309">OnControlLost()</text>
  <text x="250" y="489" class="note-body" fill="#78350f">Stop normal commands immediately (except e-stop);</text>
  <text x="250" y="509" class="note-body" fill="#78350f">switch to observer and keep monitoring</text>

  <text x="830" y="543" class="msg">⑥ APP disconnects</text>
  <line x1="1028" y1="555" x2="632" y2="555" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#m-slate)"/>

  <text x="410" y="593" class="msg">⑦ Push: ownership available</text>
  <line x1="608" y1="605" x2="212" y2="605" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>

  <rect x="230" y="635" width="360" height="62" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="250" y="660" class="note-title" fill="#1d4ed8">OnControlAvailable()</text>
  <text x="250" y="683" class="note-body" fill="#1e40af">Call TakeControl() to request ownership if needed</text>

  <text x="410" y="713" class="msg">⑧ TakeControl(): request ownership</text>
  <line x1="212" y1="725" x2="608" y2="725" stroke="#64748b" stroke-width="2" marker-end="url(#m-slate)"/>

  <text x="410" y="758" class="msg">⑨ OnTakeControlAck(error_code = 0): granted</text>
  <line x1="608" y1="770" x2="212" y2="770" stroke="#16a34a" stroke-width="2" marker-end="url(#m-green)"/>

  <text x="410" y="803" class="msg">⑩ Resume normal commands</text>
  <line x1="212" y1="815" x2="608" y2="815" stroke="#64748b" stroke-width="2" marker-end="url(#m-slate)"/>

  <!-- Legend -->
  <line x1="70" y1="872" x2="100" y2="872" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/>
  <text x="110" y="877" class="legend">SDK is controller</text>
  <line x1="280" y1="872" x2="310" y2="872" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <text x="320" y="877" class="legend">SDK is observer</text>
  <line x1="490" y1="872" x2="520" y2="872" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
  <text x="530" y="877" class="legend">APP is controller</text>
</svg>
